<body><div class="shell"><img class="hero-image" src="careerport-fv.png" alt="CareerPort｜20代のキャリアへ、新しい行き先を。" onerror="this.style.display='none'" /><main class="main"><div id="app"></div></main><footer class="foot"><a href="privacy.html" target="_blank" rel="noopener">個人情報等の取扱い</a><br>© Bitters Club株式会社</footer></div>
<script>
(()=>{
// GAS予約APIの公開URLを設定してから受付を開始してください。
const BOOKING_API_URL = 'https://script.google.com/macros/s/AKfycbwAF5hZ4lt2aF6ce9cIkZWqqWVsWlWRdC2CU2HbSBq2UPMs5H9UZFCgbxhpFj5vqVEgww/exec';
const qs=[
{title:'今の仕事で「このままでいいのかな」と感じるのは、どんな点ですか？',options:['仕事内容や自分との相性','成長や今後のキャリア','収入・待遇・働き方','人間関係・職場環境','まだはっきりしない／上記以外']},
{title:'転職・就職の希望時期はいつ頃ですか？',options:['1か月以内','1か月から3か月程度','3か月より先','まだ決めていない']},
{title:'正社員・契約社員など、どの形で働きたいですか？',options:['正社員','契約社員','アルバイト・パート','まだ決まっていない']},
{title:'どんな仕事に興味がありますか？（複数選択可）',options:['人と関わりながら働く仕事','技術を身につけたり、ものを作る仕事','体を動かして取り組む仕事','その他の仕事','まだ決まっていない'],multiple:true},
{title:'年齢を教えてください',options:Array.from({length:43},(_,i)=>`${i+18}歳`)}
];
let step=0,values={},name='',phone='',mode='weekday',date='',time='',band='',error='',finished=false,applicationReceived=false,submitting=false,consented=false;
let takenSlots=new Set(),availabilityLoading=false,availabilityLoaded=false,requestId='', formStarted=false, eventStepSet=new Set();
const STORAGE_KEY='careerport_entry_draft_v2';
function remember(){try{sessionStorage.setItem(STORAGE_KEY,JSON.stringify({step,values,name,phone,mode,date,time,band,consented,requestId,finished,applicationReceived,formStarted,at:Date.now()}));}catch(e){}}
function recover(){try{const d=JSON.parse(sessionStorage.getItem(STORAGE_KEY)||'null');if(!d||Date.now()-d.at>2*60*60*1000)return;step=Math.max(0,Math.min(7,d.step||0));values=d.values||{};name=d.name||'';phone=d.phone||'';mode=d.mode||'weekday';date=d.date||'';time=d.time||'';band=d.band||'';consented=!!d.consented;requestId=d.requestId||'';finished=!!d.finished;applicationReceived=!!d.applicationReceived;formStarted=!!d.formStarted||step>0;}catch(e){}}
recover();
function resetToTop(){
  if(submitting)return;
  if(step>0&&!finished&&!window.confirm('入力内容を破棄して最初の質問に戻りますか？'))return;
  step=0;values={};name='';phone='';mode='weekday';date='';time='';band='';
  error='';finished=false;applicationReceived=false;submitting=false;consented=false;requestId='';
  formStarted=false;eventStepSet.clear();
  try{sessionStorage.removeItem(STORAGE_KEY)}catch(e){}
  view();window.scrollTo({top:0,behavior:'smooth'});
}
const app=document.getElementById('app');
const params = new URLSearchParams(location.search);
const getParam=k=>params.get(k)||'';
// SalesPort同様、fbcの時刻はCAPI送信時ではなくLP到達時刻を使用する。
const metaLandingTime = Date.now();
function getCookieValue(key){return document.cookie.split('; ').find(x=>x.startsWith(key+'='))?.slice(key.length+1)||'';}
function buildFbc(fbclid){return fbclid?'fb.1.'+metaLandingTime+'.'+fbclid:'';}
function sourceData(){const fbclid=getParam('fbclid');return {sessionId:getSessionId(),pageUrl:location.href,utm_source:getParam('utm_source'),utm_medium:getParam('utm_medium'),utm_campaign:getParam('utm_campaign'),utm_content:getParam('utm_content'),utm_term:getParam('utm_term'),fbclid,fbc:getCookieValue('_fbc')||buildFbc(fbclid),fbp:getCookieValue('_fbp'),client_user_agent:navigator.userAgent,ad_id:getParam('ad_id'),adset_id:getParam('adset_id')}}
const allowedSlots=Array.from({length:18},(_,i)=>`${String(10+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`).filter(t=>t<'19:00');
const bands=[{label:'10:00〜12:00',start:'10:00',end:'12:00'},{label:'12:00〜14:00',start:'12:00',end:'14:00'},{label:'14:00〜16:00',start:'14:00',end:'16:00'},{label:'16:00〜19:00',start:'16:00',end:'19:00'}];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateObj=(n)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d};
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function weekdays(){const arr=[];for(let i=0;i<=7;i++){const d=dateObj(i);if(d.getDay()>0&&d.getDay()<6)arr.push(d)}return arr}
function calendar(){
  if(!availabilityLoaded)return '<div class="muted">空き枠を確認しています…</div>';
  const selectBand=`<div class="choice-mode"><p class="hint" style="margin:0">まず希望する時間帯を選択してください</p>${bands.map(b=>`<button type="button" class="choice ${band===b.label?'selected':''}" data-band="${b.label}"><strong>${b.label}</strong></button>`).join('')}</div>`;
  if(!band)return selectBand;
  const range=bands.find(b=>b.label===band);
  const valid=allowedSlots.filter(t=>t>=range.start&&t<range.end);
  const days=weekdays().filter(d=>valid.some(t=>!takenSlots.has(fmt(d)+' '+t)));
  if(!days.length)return selectBand+'<div class="muted">この時間帯は現在空きがありません。別の時間帯をお選びください。</div>';
  if(!days.some(d=>fmt(d)===date)){date='';time='';}
  const dates=`<div class="schedule"><div class="weekhead"><strong>空きがある日程（本日から7日先まで）</strong></div><div class="days">${days.map(d=>`<button type="button" class="day ${fmt(d)===date?'active':''}" data-date="${fmt(d)}"><b>${d.getMonth()+1}/${d.getDate()}</b>${'日月火水木金土'[d.getDay()]}</button>`).join('')}</div></div>`;
  const times=date?`<div class="slots">${valid.filter(t=>!takenSlots.has(date+' '+t)).map(t=>`<button type="button" class="slot ${time===t?'active':''}" data-time="${t}">${t}</button>`).join('')}</div>`:'';
  return selectBand+dates+times;
}
function track(name,extra={}){
  // GA4には氏名・電話番号・回答内容を送らない。予約成功時のみgenerate_lead。
  const gaNames = {
    form_start:'form_start', question_answer:'form_step_complete',
    contact_completed:'contact_step_complete', booking_complete:'generate_lead'
  };
  if(gaNames[name] && typeof window.gtag === 'function'){
    const params = name === 'question_answer' ? {question_number: Number(extra.step) || 0} :
      name === 'booking_complete' ? {lead_type:'booking',booking_type:extra.bookingType === 'flex' ? 'manual_request' : 'scheduled'} : {};
    window.gtag('event',gaNames[name],params);
  }
  // Meta向けのリードイベントは送信しない。GA4イベントは上で送信済み。
  if(name==='booking_complete'||!BOOKING_API_URL)return;
  const body={kind:'event',event:name,sessionId:getSessionId(),pageUrl:location.href,utm_source:getParam('utm_source'),utm_medium:getParam('utm_medium'),utm_campaign:getParam('utm_campaign'),utm_content:getParam('utm_content'),utm_term:getParam('utm_term'),at:new Date().toISOString(),...extra};
  try{fetch(BOOKING_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body),keepalive:true}).catch(()=>{});}catch(e){}
}
function getSessionId(){
  try{let k='careerport_entry_session',s=sessionStorage.getItem(k);if(!s){s=crypto.randomUUID?.()||'ss-'+Date.now()+'-'+Math.random();sessionStorage.setItem(k,s)}return s}catch(e){return 'ss-'+Date.now()}
}
function fetchAvailability(){
  if(!BOOKING_API_URL||availabilityLoading)return;
  const startedAt=performance.now();
  availabilityLoading=true;
  const key='__spSlots'+Date.now()+Math.floor(Math.random()*1e5);
  const script=document.createElement('script');
  const clean=()=>{clearTimeout(timer);delete window[key];script.remove();availabilityLoading=false;};
  window[key]=response=>{if(response?.ok){console.info('[CareerPort] 空き枠取得:',Math.round(performance.now()-startedAt)+'ms','GAS処理:',response.serverMs+'ms','キャッシュ:',!!response.cached);takenSlots=new Set(response.taken||[]);availabilityLoaded=true;error='';}else{error='空き枠の取得に失敗しました（'+String(response?.reason||'サーバー応答エラー')+'）。';}clean();if(step===6&&mode==='weekday')view();};
  const timer=setTimeout(()=>{clean();if(step===6){error='空き枠の取得に失敗しました（応答なし）。';view();}},12000);
  script.onerror=()=>{clean();if(step===6){error='空き枠の取得に失敗しました（応答なし）。';view();}};
  script.src=BOOKING_API_URL+'?action=slots&callback='+encodeURIComponent(key)+'&t='+Date.now();
  document.head.appendChild(script);
}
function submitBooking(payload){
  return new Promise((resolve,reject)=>{
    const nonce=payload.requestId;
    const frame=document.createElement('iframe');
    frame.name='spBookingFrame_'+nonce.replace(/[^\w-]/g,'');
    frame.style.display='none';
    const form=document.createElement('form');form.method='POST';form.action=BOOKING_API_URL;form.target=frame.name;form.style.display='none';
    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);
    const timer=setTimeout(()=>finish(new Error('timeout')),40000);
    let complete=false;
    function finish(err,result){if(complete)return;complete=true;clearTimeout(timer);window.removeEventListener('message',onMessage);setTimeout(()=>{frame.remove();form.remove()},100);if(err)reject(err);else resolve(result);}
    function onMessage(event){
      // HTML Serviceはscript.googleusercontent.com等から返る
      // GAS HtmlServiceのサンドボックスは入れ子iframeを使う場合がある。
      // requestIdとGoogle配信元を両方確認する。
      // GAS HtmlService can deliver the response from a nested Google frame; compare nonce and trusted origin instead of frame identity.
      if(event.origin!=='null'&&!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(event.origin))return;
      const v=event.data;
      if(v?.channel!=='careerport_booking' || v?.requestId!==nonce)return;
      if(v.ok===true)finish(null,v);
      else finish(new Error(v.message||'受付エラー'));
    }
    window.addEventListener('message',onMessage);
    document.body.appendChild(frame);document.body.appendChild(form);
    form.submit();
  });
}
window.addEventListener('pagehide',()=>{if(step===5){name=document.querySelector('#person')?.value||name;phone=document.querySelector('#phone')?.value||phone;}remember();});
track('lp_view');
let lastTrackedScreen = -1;
function trackScreenOnce(){
  if(step === lastTrackedScreen || finished)return;
  lastTrackedScreen = step;
  const event = step === 5 ? (applicationReceived?'application_thanks_view':'application_step_view') : step === 6 ? 'booking_step_view' : step === 7 ? 'booking_confirmation_view' : '';
  if(event && typeof window.gtag === 'function')window.gtag('event',event);
}
function view(){
  remember();trackScreenOnce();
  if(finished){app.innerHTML=`<div class="end"><div class="circle">✓</div><h2>面談日時の予約が完了しました</h2><p>ご予約の日時に担当者からお電話いたします。所要時間は10分程度です。</p><div class="summary"><b>お名前：</b>${esc(name)}<br><b>電話番号：</b>${esc(phone)}<br><b>予約日時：</b>${esc(date)} ${esc(time)}</div></div>`;return;}
  if(applicationReceived&&step===5){app.innerHTML=`<div class="end"><div class="circle">✓</div><h2>予約申し込みありがとうございます</h2><p>お申し込みを受け付けました。<br>面談前に、担当CAより確認のSMSをお送りします。<br>具体的な面談日時は、下のボタンから選択できます。日時を今決められない場合も、お申し込みは受け付け済みです。</p><button class="btn" type="button" data-act="chooseSlot">具体的な日程を選択する</button></div>`;bind();return;}
  const titles=[...qs.map(q=>q.title),'面談の予約を申し込む','具体的な面談日時を選ぶ','予約内容をご確認ください'];let body='';
  if(step<5){let q=qs[step];body=step===4?`<div class="field"><label for="age">年齢</label><select id="age"><option value="">選択してください</option>${q.options.map(x=>`<option value="${x}" ${values[step]===x?'selected':''}>${x}</option>`).join('')}</select></div>`:q.multiple?`<div class="options">${q.options.map((x,i)=>{const selected=Array.isArray(values[step])&&values[step].includes(x);return `<button type="button" class="option ${selected?'selected':''}" data-multi="${i}">${esc(x)}<span class="check">${selected?'✓':'+'}</span></button>`}).join('')}</div>`:`<div class="options">${q.options.map((x,i)=>`<button class="option ${values[step]===x?'selected':''}" data-option="${i}">${esc(x)}<span class="check">${values[step]===x?'✓':'›'}</span></button>`).join('')}</div>`;}
  else if(step===5){body=`<div class="field"><label for="person">お名前</label><input id="person" autocomplete="name" placeholder="例：山田 太郎" value="${esc(name)}" /></div><div class="field"><label for="phone">電話番号</label><input id="phone" inputmode="tel" type="tel" autocomplete="tel" placeholder="例：09012345678" value="${esc(phone)}"/><small>お申し込み後、担当者からご連絡します。申し込み完了後に具体的な面談日時を選べます。</small></div>`;}
  else if(step===6){body=`${availabilityLoaded?calendar():'<div class="muted">空き枠を確認しています…</div>'}<div class="muted">面談の申し込みは受け付け済みです。日時を選ばずに戻っても、申し込みは取り消されません。</div>`;}
  else {body=`<div class="summary"><b>電話相談</b><br>${esc(date)} ${esc(time)}<br><small>所要時間：約10分</small><hr><b>お名前：</b>${esc(name)}<br><b>電話番号：</b>${esc(phone)}</div>`;}
  app.innerHTML=`<div class="meta"><span>あなたに合う仕事の選択肢を、一緒に考えます。</span><span class="meta-right"><button type="button" class="top-return" data-act="top">↩ TOPに戻る</button><span>STEP ${step+1} / 8</span></span></div><div class="progressLine"><span style="width:${(step+1)/8*100}%"></span></div><h2 class="question">${titles[step]}</h2><div class="hint">${step<5?'選択するだけで回答できます。':step===5?'お名前と電話番号を入力して、面談をお申し込みください。':step===6?'空いている日時を選択してください。':'日時と連絡先をご確認ください。'}</div>${body}${step===5?`<label class="consent"><input type="checkbox" id="consent" ${consented?'checked':''}><span><a href="privacy.html" target="_blank" rel="noopener">個人情報等の取扱い</a>を確認し、電話相談の申し込みに同意します。</span></label>`:''}${error?`<p class="error">${esc(error)}</p>${step===6?'<button class="back" type="button" data-act="retrySlots">空き枠を再取得</button>':''}`:''}<div class="actions">${step>0?'<button class="back" data-act="back">戻る</button>':''}${step===4?'':`<button class="btn" data-act="next">${step===5?(submitting?'送信中…':'予約を申し込む'):step===6?'この日時を確認する':step===7?(submitting?'送信中…':'この日時で予約を確定する'):'次へ'}</button>`}</div>`;bind();}

async function next(){
  if(submitting)return;
  error='';
  if(step<5){const answer=values[step];if(qs[step].multiple?(!Array.isArray(answer)||answer.length===0):!answer)error='回答を選択してください。';else if(!eventStepSet.has(step)){track('question_answer',{step:step+1});eventStepSet.add(step)}}
  else if(step===5&&!applicationReceived){
    name=document.querySelector('#person')?.value.trim()||'';phone=document.querySelector('#phone')?.value.replace(/[^0-9]/g,'')||'';
    if(!/^[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}A-Za-z\s\u3000\u30fc\u3005\u3006\u3007]+$/u.test(name))error='お名前は漢字・ひらがな・カタカナ・ローマ字で入力してください（記号・数字不可）。';
    else if(!/^0\d{9,10}$/.test(phone))error='正しい電話番号を入力してください。';
    else if(!document.querySelector('#consent')?.checked)error='個人情報等の取扱いへの同意が必要です。';
  }
  else if(step===6&&(!band||!date||!time))error='時間帯・日付・時刻を選択してください。';
  else if(step===6&&(!availabilityLoaded||takenSlots.has(date+' '+time)))error='空き枠を再度確認してください。';
  if(error){view();return;}
  if(step<5){step++;view();return;}
  if(step===5&&!applicationReceived){
    if(!BOOKING_API_URL){error='受付システムに接続できません。';view();return;}
    submitting=true;view();requestId=requestId||(crypto.randomUUID?.()||('req-'+Date.now()+'-'+Math.random().toString(36).slice(2)));
    const data={kind:'booking',requestId,service:'CareerPort',answers:qs.map((q,i)=>({question:q.title,answer:Array.isArray(values[i])?values[i].join('、'):(values[i]||'')})),name,phone,bookingType:'application',bookingDate:'',bookingTime:'',consent:true,submittedAt:new Date().toISOString(),source:sourceData()};
    try{const result=await submitBooking(data);if(result.ok!==true)throw new Error(result.message||'申込失敗');applicationReceived=true;track('contact_completed');if(typeof window.gtag==='function')window.gtag('event','generate_lead',{lead_type:'application'});}
    catch(err){error='申し込みを確認できませんでした。通信状況を確認して、もう一度お試しください。';console.error('CareerPort application error',err);}
    submitting=false;view();return;
  }
  if(step===6){step=7;view();return;}
  if(step!==7||!BOOKING_API_URL)return;
  submitting=true;view();
  const data={kind:'booking_update',requestId,service:'CareerPort',bookingDate:date,bookingTime:time};
  try{const result=await submitBooking(data);if(result.ok!==true)throw new Error(result.message||'予約失敗');finished=true;track('booking_complete',{bookingType:'weekday'});}
  catch(err){const msg=String(err.message||'');if(msg.includes('SLOT_TAKEN')){error='選択した日時は埋まりました。別の日時を選んでください。';availabilityLoaded=false;fetchAvailability();step=6;}else if(msg.includes('INVALID_SLOT')){error='予約可能時間が変わりました。空き枠を再取得してください。';availabilityLoaded=false;fetchAvailability();step=6;}else{error='予約の確定を確認できませんでした。申し込みは受け付け済みです。通信状況を確認して再度お試しください。';step=6;}console.error('CareerPort booking update error',err);}
  submitting=false;view();
}

function bind(){
  app.querySelectorAll('[data-option]').forEach(el=>el.addEventListener('click',()=>{values[step]=qs[step].options[Number(el.dataset.option)];if(!formStarted){formStarted=true;track('form_start');}if(!eventStepSet.has(step)){track('question_answer',{step:step+1});eventStepSet.add(step)}error='';step++;view()}));
  app.querySelectorAll('[data-multi]').forEach(el=>el.addEventListener('click',()=>{const option=qs[step].options[Number(el.dataset.multi)],unknown='まだ決まっていない';let selected=Array.isArray(values[step])?[...values[step]]:[];if(option===unknown){selected=selected.includes(unknown)?[]:[unknown]}else{selected=selected.filter(x=>x!==unknown);selected=selected.includes(option)?selected.filter(x=>x!==option):[...selected,option]}values[step]=selected;if(!formStarted){formStarted=true;track('form_start');}error='';view()}));
  app.querySelector('#consent')?.addEventListener('change',e=>{consented=e.target.checked});
  app.querySelector('#age')?.addEventListener('change',e=>{values[4]=e.target.value;if(e.target.value){if(!eventStepSet.has(4)){track('question_answer',{step:5});eventStepSet.add(4)}error='';step=5;view()}});
  app.querySelectorAll('[data-band]').forEach(el=>el.addEventListener('click',()=>{band=el.dataset.band;date='';time='';error='';view()}));
  app.querySelectorAll('[data-date]').forEach(el=>el.addEventListener('click',()=>{date=el.dataset.date;time='';view()}));
  app.querySelectorAll('[data-time]').forEach(el=>el.addEventListener('click',()=>{time=el.dataset.time;view()}));
  app.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>{const a=el.dataset.act;if(a==='next')next();if(a==='top')resetToTop();if(a==='chooseSlot'){step=6;mode='weekday';band='';date='';time='';error='';if(!availabilityLoaded&&!availabilityLoading)fetchAvailability();view();}if(a==='back'){if(step===6&&applicationReceived){step=5;error='';view();return;}if(step===5){name=document.querySelector('#person')?.value||name;phone=document.querySelector('#phone')?.value||phone;}step=Math.max(0,step-1);error='';view();}if(a==='retrySlots'){error='';availabilityLoaded=false;fetchAvailability();view();}}));
}

// delegate week navigation separately to avoid primary "next" button collision
view();if(step===6&&!finished&&applicationReceived&&!availabilityLoaded&&mode==='weekday')fetchAvailability();
})();
</script></body></html>
